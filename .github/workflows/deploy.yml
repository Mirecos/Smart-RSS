name: Deploy

# Push to main: test -> build & push the Docker image to GHCR -> deploy to the server over SSH.
# Manual run ("Run workflow"): same, or redeploy an existing image tag (rollback) without rebuilding.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy (e.g. sha-1a2b3c4) for a rollback. Leave empty to build this commit.'
        required: false
        default: ''

# Never run two deployments at the same time; never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        name: Compute image name and tag
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: image
    # Runs after a successful build, or directly when redeploying an existing tag.
    if: ${{ !cancelled() && !failure() && (needs.image.result == 'success' || inputs.image_tag) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/smart-rss' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment settings
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          missing=()
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS APP_ENV; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in the 'production' environment: ${missing[*]} (see README > Deployment)"
            exit 1
          fi

      - id: target
        name: Resolve image
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.image.outputs.tag }}
        run: |
          tag="${INPUT_TAG:-$BUILT_TAG}"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      # SC2029: DEPLOY_PATH / GITHUB_ACTOR are expanded on the runner on purpose (the server does not know them).
      - name: Upload compose files
        run: |
          # shellcheck disable=SC2029
          ssh deploy-target "mkdir -p '${DEPLOY_PATH}/deploy'"
          scp docker-compose.yml "deploy-target:${DEPLOY_PATH}/docker-compose.yml"
          scp deploy/Caddyfile deploy/remote-deploy.sh "deploy-target:${DEPLOY_PATH}/deploy/"

      - name: Write the server .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          IMAGE_REF: ${{ steps.target.outputs.ref }}
        run: |
          # Sent over SSH stdin: the values never appear in logs or on the server's command line.
          # shellcheck disable=SC2029
          { printf '%s\n' "$APP_ENV"; printf 'APP_IMAGE=%s\n' "$IMAGE_REF"; } \
            | ssh deploy-target "umask 077 && cat > '${DEPLOY_PATH}/.env'"

      - name: Pull and restart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh deploy-target "bash '${DEPLOY_PATH}/deploy/remote-deploy.sh' '${GITHUB_ACTOR}'"

      - name: Summary
        env:
          IMAGE_REF: ${{ steps.target.outputs.ref }}
        run: |
          echo "### Deployed \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Roll back: Actions > Deploy > Run workflow, with an earlier \`sha-...\` tag." >> "$GITHUB_STEP_SUMMARY"
