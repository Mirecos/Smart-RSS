name: Deploy

# Push to main: test -> build & push the Docker image to GHCR -> deploy to the server over SSH.
# Manual run ("Run workflow"): same, or redeploy an existing image tag (rollback) without rebuilding.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy (e.g. sha-1a2b3c4) for a rollback. Leave empty to build this commit.'
        required: false
        default: ''

# Never run two deployments at the same time; never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        name: Compute image name and tag
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: image
    # Runs after a successful build, or directly when redeploying an existing tag.
    if: ${{ !cancelled() && !failure() && (needs.image.result == 'success' || inputs.image_tag) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/smart-rss' }}
    steps:
      - uses: actions/checkout@v4

      # Validates and cleans the connection settings (pasted secrets often carry spaces, line breaks,
      # "user@", "ssh://" or ":port"), then exports them as TARGET_HOST / TARGET_USER / TARGET_PORT.
      # Secret values are never printed: errors only describe what is wrong.
      - name: Check deployment settings
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT_SETTING: ${{ vars.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          missing=()
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS APP_ENV; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          [ ${#missing[@]} -eq 0 ] || fail "Missing secrets in the 'production' environment: ${missing[*]} (see README > Deployment)"

          host="$(clean "$SSH_HOST")"
          user="$(clean "$SSH_USER")"
          port="$(clean "${SSH_PORT_SETTING:-}")"
          fixes=()
          if [[ "$host" == ssh://* ]]; then host="${host#ssh://}"; fixes+=("removed the ssh:// prefix"); fi
          if [[ "$host" == *@* ]]; then host="${host#*@}"; fixes+=("removed a 'user@' prefix (the user belongs in SSH_USER)"); fi
          host="${host%%/*}"
          if [[ "$host" =~ ^([^:]+):([0-9]+)$ ]]; then
            host="${BASH_REMATCH[1]}"; port="${port:-${BASH_REMATCH[2]}}"; fixes+=("moved ':port' out of the host (use the SSH_PORT variable)")
          fi
          host="${host#[}"; host="${host%]}"
          port="${port:-22}"

          [[ "$host" =~ ^[A-Za-z0-9.-]+$ || "$host" =~ ^[0-9A-Fa-f:]+$ ]] \
            || fail "SSH_HOST must contain only the server's IP address or hostname (it contains spaces or other characters)"
          [[ "$port" =~ ^[0-9]+$ ]] || fail "The SSH_PORT variable must be a number"
          [[ "$user" =~ ^[a-z_][a-z0-9_.-]*$ ]] || fail "SSH_USER must contain only the Linux user name, e.g. deploy"
          getent ahosts "$host" >/dev/null \
            || fail "SSH_HOST cannot be resolved from GitHub's runners (they only use public DNS). Use the server's public IP address, or a hostname that exists in public DNS"

          for fix in "${fixes[@]}"; do echo "::warning::SSH_HOST: ${fix}. It works, but consider cleaning the secret."; done
          echo "::add-mask::${host}"
          echo "::add-mask::${user}"
          { echo "TARGET_HOST=${host}"; echo "TARGET_USER=${user}"; echo "TARGET_PORT=${port}"; } >> "$GITHUB_ENV"

      - id: target
        name: Resolve image
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.image.outputs.tag }}
        run: |
          tag="${INPUT_TAG:-$BUILT_TAG}"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # tr -d '\r': keys and host lists pasted from Windows may carry CRLF line endings.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${TARGET_HOST}
            User ${TARGET_USER}
            Port ${TARGET_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      # SC2029: DEPLOY_PATH / GITHUB_ACTOR are expanded on the runner on purpose (the server does not know them).
      - name: Upload compose files
        run: |
          # shellcheck disable=SC2029
          ssh deploy-target "mkdir -p '${DEPLOY_PATH}/deploy'"
          scp docker-compose.yml "deploy-target:${DEPLOY_PATH}/docker-compose.yml"
          scp deploy/Caddyfile deploy/remote-deploy.sh "deploy-target:${DEPLOY_PATH}/deploy/"

      - name: Write the server .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          IMAGE_REF: ${{ steps.target.outputs.ref }}
        run: |
          # Sent over SSH stdin: the values never appear in logs or on the server's command line.
          # shellcheck disable=SC2029
          { printf '%s\n' "$APP_ENV"; printf 'APP_IMAGE=%s\n' "$IMAGE_REF"; } \
            | ssh deploy-target "umask 077 && cat > '${DEPLOY_PATH}/.env'"

      - name: Pull and restart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$REGISTRY_TOKEN" \
            | ssh deploy-target "bash '${DEPLOY_PATH}/deploy/remote-deploy.sh' '${GITHUB_ACTOR}'"

      - name: Summary
        env:
          IMAGE_REF: ${{ steps.target.outputs.ref }}
        run: |
          echo "### Deployed \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Roll back: Actions > Deploy > Run workflow, with an earlier \`sha-...\` tag." >> "$GITHUB_STEP_SUMMARY"
